# Monorepo stack: Postgres + FastAPI + Vite frontend
# From this directory: docker compose up --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: erm_postgres
    environment:
      POSTGRES_USER: erm_user
      POSTGRES_PASSWORD: erm_password
      POSTGRES_DB: erm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erm_user -d erm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BACK
      dockerfile: Dockerfile
    container_name: erm_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://erm_user:erm_password@postgres:5432/erm_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '["http://localhost:5173","http://frontend:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./FRONT
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_APP_TITLE: ERM Platform
    container_name: erm_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: erm_network
